name: test

on:
  pull_request:
    branches:
      - main

jobs:
  rust-tools:
    name: Rust mdm-tools
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdm-tools
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run tests
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check

  mdm-server:
    name: Bun mdm-server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpassword
          POSTGRES_DB: mdm_bun_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      floci:
        image: hectorvent/floci:latest
        ports:
          - 4566:4566
    defaults:
      run:
        working-directory: mdm-server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Prepare database
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://pguser:pgpassword@127.0.0.1:5432/mdm_bun_test
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun test
        env:
          TEST_DATABASE_URL: postgres://pguser:pgpassword@127.0.0.1:5432/mdm_bun_test
          TEST_S3_ENDPOINT: http://127.0.0.1:4566
          TEST_S3_BUCKET: oreore-ios-mdm-test
          TEST_S3_ACCESS_KEY_ID: test
          TEST_S3_SECRET_ACCESS_KEY: test

  test-server:
    name: Bun test-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun test
